<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مهامي اليومية</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #f8efff, #eee5ff);
      color: #382447;
    }

    .container {
      width: 100%;
      max-width: 500px;
      padding: 28px 20px;
      background: white;
      border-radius: 22px;
      box-shadow: 0 10px 35px #75528a20;
    }

    h1 {
      text-align: center;
      color: #8e5a82;
    }

    .subtitle {
      text-align: center;
      color: #887b91;
      margin-bottom: 25px;
    }

    .input-area {
      display: flex;
      gap: 8px;
    }

    #taskInput {
      flex: 1;
      width: 60%;
      min-width: 0;
      padding: 13px;
      border: 1px solid #e1d3ec;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 12px;
      font-size: 14px;
      cursor: pointer;
    }

    .add-btn {
      background: #8e5a82;
      color: white;
      font-weight: bold;
    }

    #taskList {
      list-style: none;
      padding: 0;
      margin-top: 22px;
    }

    #taskList li {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px;
      margin-bottom: 10px;
      background: #faf6ff;
      border-radius: 12px;
      overflow-wrap: anywhere;
    }

    #taskList li span {
      flex: 1;
    }

    #taskList li.done span {
      text-decoration: line-through;
      color: #9c91a5;
    }

    .delete-btn {
      background: #ffe8ee;
      color: #c04464;
    }

    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-top: 20px;
      color: #786782;
      font-size: 13px;
    }

    .clear-btn {
      background: #eee5ff;
      color: #70446a;
    }

    .empty {
      justify-content: center;
      color: #a092ad;
    }
  </style>
</head>

    </form>

      <span id="remaining">المهام المتبقية: 0</span>
      <button id="clearBtn" class="clear-btn" type="button">
        حذف المنجَز
      </button>
    </div>
  </main>
