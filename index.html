<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مهامي اليومية</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  font-family: Arial, sans-serif;
  background: #f5eaff;
  color: #382447;
}

.container {
  max-width: 500px;
  margin: 50px auto;
  background: white;
  padding: 25px;
  border-radius: 20px;
  box-shadow: 0 5px 20px #0001;
}

h1 {
  text-align: center;
  color: #8e5a82;
}

p {
  text-align: center;
  color: #887b91;
}

.input-area {
  display: flex;
  gap: 8px;
}

input[type="text"] {
  flex: 1;
  width: 60%;
  min-width: 0;
  padding: 12px;
  border: 1px solid #d9c6e8;
  border-radius: 8px;
  font-size: 16px;
}

button {
  border: none;
  border-radius: 8px;
  padding: 12px;
  cursor: pointer;
  font-size: 15px;
}

#addBtn {
  background: #8e5a82;
  color: white;
}

ul {
  padding: 0;
  list-style: none;
}

li {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-top: 12px;
  padding: 12px;
  background: #faf6ff;
  border-radius: 8px;
}

li span {
  flex: 1;
  overflow-wrap: anywhere;
}

li.done span {
  text-decoration: line-through;
  color: #999;
}

.delete {
  background: #ffe1e9;
  color: #b52d50;
}

#count {
  margin-top: 20px;
  text-align: center;
  color: #8e5a82;
}
</style>
</head>

<body>
<div class="container">
  <h1>✨ مهامي اليومية</h1>
  <p>نظّمي يومك وحققي أهدافك 💜</p>

  <div class="input-area">
    <input id="taskInput" type="text"
      placeholder="اكتبي مهمة جديدة...">
    <button id="addBtn" type="button">إضافة +</button>
  </div>

  <ul id="taskList"></ul>
  <div id="count">المهام المتبقية: 0</div>
</div>

<script>
const taskInput = document.getElementById("taskInput");
const addBtn = document.getElementById("addBtn");
const taskList = document.getElementById("taskList");
const count = document.getElementById("count");

let tasks = [];

function updateCount() {
  let remaining = tasks.filter(task => !task.done).length;
  count.textContent = "المهام المتبقية: " + remaining;
}

function showTasks() {
  taskList.innerHTML = "";

  tasks.forEach(function(task, index) {
    const li = document.createElement("li");
    if (task.done) li.classList.add("done");

    const checkbox = document.createElement("input");
    checkbox.type = "checkbox";
    checkbox.checked = task.done;

    checkbox.addEventListener("change", function() {
      tasks[index].done = checkbox.checked;
      showTasks();
    });

    const span = document.createElement("span");
    span.textContent = task.text;

    const deleteBtn = document.createElement("button");
    deleteBtn.textContent = "حذف";
    deleteBtn.className = "delete";

    deleteBtn.addEventListener("click", function() {
      tasks.splice(index, 1);
      showTasks();
    });

    li.appendChild(checkbox);
    li.appendChild(span);
    li.appendChild(deleteBtn);
    taskList.appendChild(li);
  });

  updateCount();
}

function addTask() {
  const text = taskInput.value.trim();

  if (text === "") {
    alert("اكتبي المهمة الأول ❤️");
    taskInput.focus();
    return;
  }

  tasks.push({
    text: text,
    done: false
  });

  taskInput.value = "";
  showTasks();
  taskInput.focus();
}

addBtn.addEventListener("click", addTask);

taskInput.addEventListener("keydown", function(event) {
  if (event.key === "Enter") {
    addTask();
  }
});
</script>
</body>
</html>
